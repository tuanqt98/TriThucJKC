openapi: 3.1.0
info:
  title: Tri Thức JKC API
  version: 1.0.0
  description: Contract đề xuất; endpoint chưa triển khai trong starter.
servers:
- url: https://trithuc.jkc.internal/api/v1
tags:
- name: Authentication
- name: Users
- name: Documents
- name: Knowledge
- name: Incidents
- name: Learning
- name: Approvals
- name: Search
- name: Integration
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: jkc_session
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    ArticleInput:
      type: object
      required:
      - title
      - kind
      - ownerDepartmentId
      - body
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        kind:
          type: string
          enum:
          - ARTICLE
          - DOCUMENT
          - INCIDENT_GUIDE
        ownerDepartmentId:
          type: string
          format: uuid
        body:
          type: object
          additionalProperties: true
    ApprovalDecision:
      type: object
      properties:
        remark:
          type: string
          maxLength: 1000
        expectedVersion:
          type: integer
          minimum: 1
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      operationId: post_auth_login
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: State or version conflict
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      operationId: post_auth_logout
      responses:
        '200':
          description: Successful operation
