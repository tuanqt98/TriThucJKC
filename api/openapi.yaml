          type: string
          format: uuid
          title: Id
        title:
          type: string
          title: Title
        author:
          type: string
          title: Author
        version_number:
          type: integer
          title: Version Number
        status:
          type: string
          title: Status
        requested_at:
          type: string
          format: date-time
          title: Requested At
      type: object
      required:
      - body
      - id
      - title
      - author
      - version_number
      - status
      - requested_at
      title: ApprovalView
    ArticleInput:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 5
          title: Title
        body:
          additionalProperties:
            type: string
            maxLength: 5000
          propertyNames:
            maxLength: 100
          type: object
          maxProperties: 12
          minProperties: 1
          title: Body
      type: object
      required:
      - title
      - body
      title: ArticleInput
    ContentPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ContentView'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        pageSize:
          type: integer
          title: Pagesize
      type: object
      required:
      - items
      - total
      - page
      - pageSize
      title: ContentPage
    ContentView:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        code:
          type: string
          title: Code
        kind:
          type: string
          title: Kind
        title:
          type: string
          title: Title
        owner_department_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner Department Id
        department_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Department Name
        version_id:
          type: string
          format: uuid
          title: Version Id
        version_number:
          type: integer
          title: Version Number
        body:
          additionalProperties: true
          type: object
          title: Body
        status:
          type: string
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - code
      - kind
      - title
      - owner_department_id
      - department_name
      - version_id
      - version_number
      - body
      - status
      - created_at
      title: ContentView
    DashboardView:
      properties:
        documents:
          type: integer
          title: Documents
        articles:
          type: integer
          title: Articles
        incidents:
          type: integer
          title: Incidents
