name: Sprint 0 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jkc
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: jkc_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jkc -d jkc_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://jkc:ci-test-only@127.0.0.1:5432/jkc_test_ci
      TEST_DATABASE_URL: postgresql://jkc:ci-test-only@127.0.0.1:5432/jkc_test_ci
      COOKIE_SECURE: "false"
      APP_ENV: test
      DEMO_PASSWORD: test-only-password-123
      UI_DEMO_PASSWORD: test-only-password-123
      APP_ORIGIN: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: starter/apps/web/package-lock.json
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r starter/apps/api/requirements-dev.lock.txt
          .venv/bin/python -m unittest discover -s scripts/tests
          .venv/bin/ruff check starter/apps/api scripts
          .venv/bin/ruff format --check starter/apps/api scripts
      - run: PYTHONPATH=starter/apps/api .venv/bin/python scripts/export_openapi.py --check
      - working-directory: starter/apps/api
        env:
          APP_ORIGIN: http://localhost:3000
        run: |
          ../../../.venv/bin/alembic upgrade head
          ../../../.venv/bin/pytest -q
      - run: .venv/bin/python scripts/database_drill.py
      - working-directory: starter/apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
      - run: |
          cd starter/apps/api
          ../../../.venv/bin/python -m app.seed
          ../../../.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/jkc-api.log 2>&1 &
      - working-directory: starter/apps/web
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/jkc-web.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:3100/login >/dev/null && curl --fail --silent http://localhost:8000/api/v1/health/ready >/dev/null; then break; fi
            sleep 1
          done
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint0-evidence
          path: |
            starter/apps/web/playwright-report
            docs/reports/*.png
            docs/reports/database-drill.json
      - run: DB_PASSWORD=config-test-only DB_RUNTIME_PASSWORD=runtime-config-test-only docker compose -f deploy/compose.yml -f deploy/compose.local.yml config --quiet
  postgres17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jkc
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: jkc_test_ci17
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jkc -d jkc_test_ci17"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://jkc:ci-test-only@127.0.0.1:5432/jkc_test_ci17
      TEST_DATABASE_URL: postgresql://jkc:ci-test-only@127.0.0.1:5432/jkc_test_ci17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r starter/apps/api/requirements-dev.lock.txt
      - working-directory: starter/apps/api
        run: |
          alembic upgrade head
          pytest -q

  staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r starter/apps/api/requirements-dev.lock.txt
          cd starter/apps/web
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate ephemeral staging secrets
        run: |
          .venv/bin/python - <<'PYCODE'
          from pathlib import Path
          import secrets
          root=Path('.local');root.mkdir(exist_ok=True)
          env={'DB_PASSWORD':secrets.token_urlsafe(36),'DB_RUNTIME_PASSWORD':secrets.token_urlsafe(36),'DEMO_PASSWORD':secrets.token_urlsafe(24),'APP_HOST':'localhost','APP_ORIGIN':'https://localhost:18443','HTTP_PORT':'18080','HTTPS_PORT':'18443','BIND_ADDRESS':'127.0.0.1','BACKUP_ROOT':str((root/'backups').resolve())}
          path=root/'ci-staging.env';path.write_text(''.join(f'{k}={v}\n' for k,v in env.items()));path.chmod(0o600)
          env.update({'DB_PASSWORD':secrets.token_urlsafe(36),'DB_RUNTIME_PASSWORD':secrets.token_urlsafe(36),'APP_ORIGIN':'https://localhost:28443','HTTP_PORT':'28080','HTTPS_PORT':'28443'})
          path=root/'ci-restore.env';path.write_text(''.join(f'{k}={v}\n' for k,v in env.items()));path.chmod(0o600)
          PYCODE
      - name: Build full HTTPS staging
        run: |
          docker compose --project-name jkc-s01-ci --env-file .local/ci-staging.env -f deploy/compose.yml up -d --build --wait --wait-timeout 240
          docker compose --project-name jkc-s01-ci --env-file .local/ci-staging.env -f deploy/compose.yml --profile demo run --rm --no-deps seed
          docker cp jkc-s01-ci-proxy-1:/data/caddy/pki/authorities/local/root.crt .local/ci-ca.crt
      - name: Real antivirus and browser acceptance
        run: |
          .venv/bin/python scripts/staging/uat.py --project jkc-s01-ci --env-file .local/ci-staging.env --ca .local/ci-ca.crt
          .venv/bin/python scripts/staging/collect_evidence.py --project jkc-s01-ci --env-file .local/ci-staging.env
      - name: Isolated DB and attachment restore
        run: |
          .venv/bin/python scripts/staging/verify_restore.py capture --project jkc-s01-ci --env-file .local/ci-staging.env
          .venv/bin/python scripts/staging/snapshot.py backup --project jkc-s01-ci --env-file .local/ci-staging.env --set ci-drill
          .venv/bin/python scripts/staging/snapshot.py restore --project jkc-s01-ci-restore --env-file .local/ci-restore.env --set ci-drill
          docker cp jkc-s01-ci-restore-proxy-1:/data/caddy/pki/authorities/local/root.crt .local/ci-restore-ca.crt
          .venv/bin/python scripts/staging/verify_restore.py verify --project jkc-s01-ci-restore --env-file .local/ci-restore.env --ca .local/ci-restore-ca.crt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint01-staging-evidence
          retention-days: 7
          path: |
            docs/reports/sprint01/*.json
            docs/reports/sprint01/**/*.png
            starter/apps/web/playwright-report
      - name: Remove only ephemeral CI stacks
        if: always()
        run: |
          if [ -f .local/ci-staging.env ]; then
            docker compose --project-name jkc-s01-ci --env-file .local/ci-staging.env -f deploy/compose.yml down --volumes
          fi
          if [ -f .local/ci-restore.env ]; then
            docker compose --project-name jkc-s01-ci-restore --env-file .local/ci-restore.env -f deploy/compose.yml down --volumes
          fi
