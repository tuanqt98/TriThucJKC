# HTTP local only. For HTTPS use compose.yml and dedicated ports, never disable TLS in staging.
services:
  proxy:
    ports: !override
      - "127.0.0.1:${LOCAL_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
  api:
    environment:
      APP_ORIGIN: http://localhost:${LOCAL_HTTP_PORT:-8080}
      COOKIE_SECURE: "false"
      APP_ENV: development
  migrate:
    environment:
      APP_ENV: development
